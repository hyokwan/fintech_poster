<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · Creator Studio</title>
<link rel="stylesheet" href="css/app.css">
<style>
  body { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } .hero { display: none !important; } }
  .hero { position: relative; overflow: hidden; padding: 56px; display: flex; flex-direction: column; justify-content: space-between;
    background: radial-gradient(1200px 600px at -10% -10%, rgba(109,139,255,.35), transparent 60%), radial-gradient(900px 500px at 110% 110%, rgba(155,123,255,.3), transparent 60%), #0a0c13; border-right: 1px solid var(--line); }
  .hero .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; }
  .hero .logo i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); font-style: normal; color: #fff; }
  .hero h2 { font-size: 44px; line-height: 1.18; letter-spacing: -0.04em; margin: 0 0 18px; }
  .hero h2 em { font-style: normal; background: linear-gradient(90deg, #a9b8ff, #d5c4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; max-width: 520px; }
  .feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 600px; }
  .feats div { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 13px; color: var(--muted); }
  .feats b { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
  .side { display: grid; place-items: center; padding: 32px 20px; }
  .box { width: min(400px, 100%); }
  .box h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.03em; }
  .box .lead { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .tabs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs2 button { background: none; border: 0; color: var(--muted); font: 700 14px 'Pretendard'; padding: 10px; border-radius: 9px; cursor: pointer; }
  .tabs2 button.on { background: var(--panel2); color: var(--text); }
  form { display: none; } form.on { display: block; }
  form .btn { width: 100%; margin-top: 18px; padding: 13px; }
  .msg { margin-top: 14px; font-size: 13px; line-height: 1.6; padding: 10px 12px; border-radius: 10px; display: none; }
  .msg.err { display: block; color: #ffc2c8; background: rgba(255,122,133,.08); border: 1px solid #5a2a33; }
  .msg.ok { display: block; color: #bff5d9; background: rgba(91,224,160,.08); border: 1px solid #22563c; }
</style>
</head>
<body data-no-shell="1">
<section class="hero">
  <div class="logo"><i>C</i>Creator Studio</div>
  <div>
    <h2>학교·학과 홍보물,<br><em>만들고 올리는 것까지</em> 한 곳에서</h2>
    <p>포스터·배너·SNS 이미지를 학과 로고와 색에 맞춰 바로 만들고, 이미지 한 장으로 네이버 카페 글까지 AI가 써서 올려 줍니다.</p>
  </div>
  <div class="feats">
    <div><b>🎨 홍보물 제작</b>포스터 · 배너 · 썸네일 · SNS · 엠블럼</div>
    <div><b>✨ AI 카페 글</b>이미지를 읽고 제목·본문 초안</div>
    <div><b>👥 학과별 권한</b>관리자 · 편집자 · 보기</div>
  </div>
</section>
<section class="side">
  <div class="box">
    <h1>시작하기</h1>
    <p class="lead">학교·학과 홍보물 제작 도구</p>
    <div class="tabs2"><button data-t="login" class="on">로그인</button><button data-t="signup">회원가입</button></div>

    <form id="login" class="on">
      <label>이메일</label><input type="email" name="email" autocomplete="username" required>
      <label>비밀번호</label><input type="password" name="password" autocomplete="current-password" required>
      <button class="btn primary">로그인</button>
    </form>

    <form id="signup">
      <label>이름</label><input type="text" name="name" autocomplete="name" required>
      <label>이메일</label><input type="email" name="email" autocomplete="username" required>
      <label>비밀번호 (8자 이상)</label><input type="password" name="password" autocomplete="new-password" minlength="8" required>
      <label>소속 학교 · 학과</label><input type="text" name="note" placeholder="예) 한국폴리텍대학 서울강서캠퍼스 AI핀테크융합과" required>
      <button class="btn primary">가입 신청</button>
      <p class="hint">관리자가 승인하면 로그인할 수 있어요.</p>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</section>
<script src="js/common.js"></script>
<script>
const msg = (t, cls) => { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + cls; };
document.querySelectorAll('.tabs2 button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tabs2 button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('form').forEach((f) => f.classList.toggle('on', f.id === b.dataset.t));
    msg('', '');
  };
});
const next = () => { const n = new URLSearchParams(location.search).get('next'); return n && n.startsWith('/') && !n.startsWith('//') ? n : '/'; };
const data = (f) => Object.fromEntries(new FormData(f));

document.getElementById('login').onsubmit = async (e) => {
  e.preventDefault();
  try { await Studio.api('/api/auth/login', data(e.target)); location.href = next(); }
  catch (err) { msg(err.message, 'err'); }
};
document.getElementById('signup').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const j = await Studio.api('/api/auth/signup', data(e.target));
    if (j.active) { location.href = '/settings.html'; return; } // 첫 가입자 = 최고 관리자
    e.target.reset();
    msg('가입 신청을 받았어요. 관리자가 승인하면 로그인할 수 있습니다.', 'ok');
  } catch (err) { msg(err.message, 'err'); }
};
</script>
</body>
</html>
