<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .hello { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .hello .mark { width: 64px; height: 64px; border-radius: 18px; background: #fff center / 80% no-repeat; flex: none; border: 1px solid var(--line); }
  .hello .mark.none { background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-size: 26px; font-weight: 900; color: #fff; }
  .hello h2 { font-size: 24px; margin: 0; }
  .hello p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 12px; }
  .sec-h h3 { margin: 0; font-size: 16px; }
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .tool { position: relative; display: block; padding: 18px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: var(--text); text-decoration: none; transition: transform .15s, border-color .15s, box-shadow .15s; overflow: hidden; }
  .tool:hover { transform: translateY(-2px); border-color: var(--line2); box-shadow: 0 14px 30px rgba(0,0,0,.35); }
  .tool .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; color: #fff; }
  .tool .ic svg { width: 24px; height: 24px; }
  .tool b { display: block; font-size: 15px; margin-bottom: 4px; }
  .tool small { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .tool.hot::after { content: 'AI'; position: absolute; top: 14px; right: 14px; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 6px 12px; border-radius: 20px; font: 600 12px 'Pretendard'; cursor: pointer; }
  .filters button.on { color: var(--text); border-color: var(--accent); background: #182040; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .item .im { display: block; aspect-ratio: 4 / 3; background: #0d1018 center / contain no-repeat; }
  .item .info { padding: 10px 12px; }
  .item .nm { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .nm small { color: var(--muted); }
  .item .acts { display: flex; gap: 6px; margin-top: 8px; }
  .item .acts a, .item .acts button { flex: 1; font-size: 11px; padding: 6px 4px; }
  .notice { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; border: 1px solid #6b5022; background: rgba(255,181,71,.06); font-size: 13px; margin-bottom: 8px; }
  .notice a { margin-left: auto; white-space: nowrap; }
</style>
</head>
<body class="shell">
<header></header>
<div class="page">
  <div class="hello" id="hello"></div>
  <div id="notices"></div>

  <div class="sec-h"><h3>무엇을 만들까요?</h3></div>
  <div class="tools" id="tools"></div>

  <div class="sec-h"><h3>최근 결과물</h3><div class="filters" id="filters"></div></div>
  <div class="gallery" id="gallery"></div>
</div>
<script src="/api/me.js"></script>
<script src="js/common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const d = window.DEPT || {};
const KIND_NAMES = { '': '전체', poster: '포스터', banner: '배너', social: 'SNS', thumbnail: '썸네일', emblem: '엠블럼' };
const TOOLS = [
  ['/poster.html', 'poster', '학과 포스터', '모집 전단지를 글씨만 바꿔서 바로', '#3b5bdb', '#7048e8'],
  ['/editor.html', 'editor', '자유 편집', '미리캔버스처럼 끌어서 자유롭게', '#1098ad', '#3b5bdb'],
  ['/banner.html', 'banner', '배너', '유튜브 채널 · 카페 대문 · 원하는 크기', '#e8590c', '#d6336c'],
  ['/social.html', 'social', '인스타 · 페이스북', '피드 · 스토리 · 페이스북 규격', '#c2255c', '#7048e8'],
  ['/thumbnail.html', 'thumbnail', '유튜브 썸네일', '1280×720 채널 스타일 썸네일', '#e03131', '#f76707'],
  ['/emblem.html', 'emblem', '엠블럼', '정사각 · 원형 · 가로형 투명 PNG', '#2b8a3e', '#1098ad'],
  ['/cafe.html', 'cafe', '카페 글쓰기', '이미지 한 장으로 AI가 글 쓰고 바로 게시', '#03c75a', '#0b7285', 'editor', true],
];

// 인사
const logo = d.symbol || d.logo;
$('hello').innerHTML = `
  ${logo ? `<div class="mark" style="background-image:url('${logo}')"></div>` : `<div class="mark none">${Studio.esc((d.name || 'C').slice(0, 1))}</div>`}
  <div><h2>${Studio.esc(d.name || '')}</h2><p>${Studio.esc(`${d.school || ''} ${d.campus || ''}`)} · ${Studio.esc(ME.name)}님, 반가워요 👋</p></div>`;

// 설정이 덜 된 부분 안내 (학과 관리자에게만)
if (Studio.can('manager')) {
  const todo = [];
  if (!d.logo && !d.symbol && !Studio.isBaseDept()) todo.push('학과 로고와 심볼 마크를 올리면 모든 템플릿에 자동으로 들어가요.');
  if (!d.cafe?.clubId || !d.naver?.connected) todo.push('네이버 카페를 연결하면 카페 글쓰기에서 바로 게시할 수 있어요.');
  $('notices').innerHTML = todo.map((t) => `<div class="notice">💡 ${t}<a href="/settings.html">학과 설정 →</a></div>`).join('');
}

$('tools').innerHTML = TOOLS.filter((t) => Studio.can(t[6] || 'viewer')).map(([href, ic, name, desc, c1, c2, , hot]) => `
  <a class="tool${hot ? ' hot' : ''}" href="${href}"><span class="ic" style="background:linear-gradient(135deg,${c1},${c2})">${Studio.icon(ic)}</span><b>${name}</b><small>${desc}</small></a>`).join('');

// 최근 결과물
let kind = '';
function filters() {
  $('filters').innerHTML = Object.entries(KIND_NAMES).map(([k, n]) => `<button data-k="${k}" class="${k === kind ? 'on' : ''}">${n}</button>`).join('');
  $('filters').querySelectorAll('button').forEach((b) => { b.onclick = () => { kind = b.dataset.k; filters(); gallery(); }; });
}
async function gallery() {
  const box = $('gallery');
  try {
    const list = await Studio.api('/api/outputs?limit=48' + (kind ? '&kind=' + kind : ''));
    if (!list.length) { box.innerHTML = '<div class="empty" style="grid-column:1/-1">아직 저장한 결과물이 없어요. 위에서 하나 만들어 보세요!</div>'; return; }
    box.innerHTML = list.map((it) => `
      <div class="item">
        <a class="im" href="${it.url}" target="_blank" style="background-image:url('${it.url}')"></a>
        <div class="info">
          <div class="nm" title="${Studio.esc(decodeURIComponent(it.name))}"><small>${KIND_NAMES[it.kind]} · ${new Date(it.t).toLocaleDateString('ko-KR')}</small><br>${Studio.esc(decodeURIComponent(it.name))}</div>
          <div class="acts">
            <a class="btn sm" href="${it.url}" download>받기</a>
            ${Studio.can('editor') ? `<button class="btn sm danger" data-del="${it.kind}/${it.name}">지우기</button>` : ''}
          </div>
        </div>
      </div>`).join('');
    box.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm('이 결과물을 지울까요?')) return;
        try { await Studio.api('/api/outputs/' + b.dataset.del, undefined, 'DELETE'); gallery(); } catch (e) { Studio.toast(e.message, 'err'); }
      };
    });
  } catch (e) { box.innerHTML = `<div class="empty">${Studio.esc(e.message)}</div>`; }
}
filters();
gallery();
</script>
</body>
</html>
